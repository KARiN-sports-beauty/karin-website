<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ご予約 | KARiN. ~Sports & Beauty~</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
  <meta name="description" content="KARiN. 東京・福岡の院内／出張のWeb予約ページです。空き枠から日時・担当をお選びいただけます。">
  <link rel="canonical" href="https://karin-sb.jp/book">
  <meta name="robots" content="index, follow">

  <meta property="og:type" content="website">
  <meta property="og:title" content="ご予約 | KARiN. ~Sports & Beauty~">
  <meta property="og:description" content="KARiN. 東京・福岡の院内／出張のWeb予約ページです。空き枠から日時・担当をお選びいただけます。">
  <meta property="og:url" content="https://karin-sb.jp/book">
  <meta property="og:image" content="https://karin-sb.jp/static/images/logoname.jpg">
  <meta property="og:site_name" content="KARiN. ~Sports & Beauty~">
  <meta name="twitter:card" content="summary_large_image">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "ご予約 | KARiN. ~Sports & Beauty~",
    "url": "https://karin-sb.jp/book",
    "description": "KARiN. 東京・福岡の院内／出張Web予約ページです。",
    "isPartOf": {
      "@type": "WebSite",
      "name": "KARiN. ~Sports & Beauty~",
      "url": "https://karin-sb.jp/"
    }
  }
  </script>
  <style>
    :root {
      --navy: #1E3A5F;
      --muted: #5a6b7d;
      --border: #e4e9ef;
      --bg: #f6f8fb;
      --ok: #1a9c55;
      --ng: #c5cdd8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans JP", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--navy);
      line-height: 1.6;
    }
    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }
    .logo {
      text-align: center;
      margin-bottom: 8px;
      font-family: "Playfair Display", "Noto Sans JP", serif;
      font-weight: 700;
      font-size: 2rem;
      letter-spacing: 0.08em;
      line-height: 1.2;
      color: #1E3A5F;
    }
    .logo span {
      display: inline-block;
      font-family: "Great Vibes", cursive;
      font-weight: 400;
      font-size: 1.25rem;
      letter-spacing: 0.04em;
      color: #1E3A5F;
      line-height: 1.2;
      vertical-align: baseline;
    }
    h1 {
      text-align: center;
      font-size: 1.35rem;
      margin: 0 0 6px;
    }
    .lead {
      text-align: center;
      font-size: 0.88rem;
      color: var(--muted);
      margin: 0 0 24px;
    }
    .lead a {
      color: var(--navy);
      font-weight: 600;
      text-decoration: underline;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px 16px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(30,58,95,0.06);
    }
    .card h2 {
      font-size: 1rem;
      margin: 0 0 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--navy);
      color: #fff;
      font-size: 0.75rem;
      flex-shrink: 0;
    }
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .chip {
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--navy);
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip:hover { border-color: var(--navy); }
    .chip.active {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
    }
    .chip:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .chip.disabled {
      opacity: 0.45;
      cursor: not-allowed;
      background: #eef1f5;
      color: #9aa8b8;
      border-color: #dde3ea;
    }
    .chip.disabled:hover { border-color: #dde3ea; }
    .chip-badge {
      display: block;
      font-size: 0.68rem;
      font-weight: 500;
      margin-top: 2px;
      opacity: 0.85;
    }
    .course-sub-label {
      font-size: 0.82rem;
      color: var(--muted);
      margin: 0 0 10px;
      font-weight: 600;
      line-height: 1.55;
    }
    .course-group {
      margin-bottom: 18px;
    }
    .course-group:last-child { margin-bottom: 0; }
    .date-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 8px;
    }
    .date-chip {
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
      background: #fff;
      cursor: pointer;
      font-size: 0.82rem;
    }
    .date-chip .d { font-weight: 700; font-size: 1rem; }
    .date-chip .w { color: var(--muted); font-size: 0.75rem; }
    .date-chip.active {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
    }
    .date-chip.active .w { color: rgba(255,255,255,0.8); }
    .date-chip:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .slots-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 0 -4px;
      padding-bottom: 4px;
    }
    .slots-table {
      border-collapse: collapse;
      font-size: 0.78rem;
      min-width: 100%;
    }
    .slots-table th, .slots-table td {
      border: 1px solid var(--border);
      padding: 6px 4px;
      text-align: center;
      white-space: nowrap;
    }
    .slots-table th {
      background: #f0f4f8;
      font-weight: 600;
    }
    .slots-table th.staff-col,
    .slots-table td.staff-col {
      position: sticky;
      left: 0;
      background: #fff;
      z-index: 1;
      text-align: left;
      min-width: 72px;
      max-width: 88px;
      font-weight: 600;
      padding-left: 8px;
      font-size: 0.75rem;
    }
    .slots-table th.staff-col { background: #f0f4f8; z-index: 2; }
    .hour-cell-btn {
      width: 40px;
      height: 34px;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: default;
      background: transparent;
      padding: 0;
    }
    .hour-cell-btn.full {
      color: var(--ok);
      cursor: pointer;
    }
    .hour-cell-btn.full:hover { background: #e8f7ee; }
    .hour-cell-btn.partial {
      color: #d97706;
      cursor: pointer;
    }
    .hour-cell-btn.partial:hover { background: #fff7ed; }
    .hour-cell-btn.ng {
      color: var(--ng);
    }
    .hour-cell-btn.none {
      color: #cbd5e1;
      font-weight: 400;
    }
    .hour-cell-btn.active-hour {
      outline: 2px solid var(--navy);
      outline-offset: 1px;
    }
    .slot-detail-panel {
      margin-top: 16px;
      padding: 14px;
      background: #f0f4f8;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .slot-detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .slot-detail-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--navy);
    }
    .slot-detail-close {
      border: none;
      background: #fff;
      border-radius: 999px;
      width: 32px;
      height: 32px;
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--muted);
      flex-shrink: 0;
    }
    .slot-detail-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    @media (max-width: 360px) {
      .slot-detail-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .slot-btn {
      width: 100%;
      min-height: 44px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.88rem;
      cursor: pointer;
      background: #fff;
    }
    .slot-btn.ok {
      color: var(--ok);
      font-weight: 700;
    }
    .slot-btn.ok:hover { background: #e8f7ee; border-color: var(--ok); }
    .slot-btn.ng {
      color: var(--ng);
      cursor: default;
      background: #f8fafc;
    }
    .slot-btn.selected {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
    }
    .slot-btn .slot-time {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .slot-btn .slot-mark {
      display: block;
      font-size: 0.75rem;
      margin-top: 2px;
    }
    .legend {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 10px;
      line-height: 1.6;
    }
    .form-grid label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .form-grid input, .form-grid textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 1rem;
      margin-bottom: 14px;
      font-family: inherit;
    }
    .form-grid textarea { min-height: 80px; resize: vertical; }
    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .summary {
      background: #f0f4f8;
      border-radius: 12px;
      padding: 14px;
      font-size: 0.88rem;
      margin-bottom: 16px;
      line-height: 1.7;
    }
    .submit-btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      background: var(--navy);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px;
      cursor: pointer;
    }
    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .hidden { display: none !important; }
    .loading, .empty-msg {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 20px 0;
    }
    .error-msg {
      color: #c0392b;
      font-size: 0.88rem;
      margin-top: 8px;
      text-align: center;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 0.85rem;
      text-decoration: none;
    }
    @media (max-width: 480px) {
      .form-row-2 { grid-template-columns: 1fr; gap: 0; }
    }

    .card.is-locked {
      opacity: 0.55;
      box-shadow: none;
    }
    .card.is-locked .step-body { display: none; }
    .card.is-done {
      opacity: 1;
      box-shadow: 0 4px 14px rgba(30,58,95,0.04);
    }
    .card.is-done .step-body { display: none; }
    .card.is-done h2,
    .card.is-locked h2 {
      margin-bottom: 0;
    }
    .card.is-active {
      outline: 2px solid rgba(30,58,95,0.18);
    }
    .step-summary {
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--navy);
      margin-left: 2px;
    }
    .step-summary:empty { display: none; }
    .step-summary:not(:empty)::before {
      content: "：";
      font-weight: 600;
      color: var(--muted);
    }
    #web_note {
      display: block;
      width: 100%;
      margin-top: 8px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 1rem;
      font-family: inherit;
      min-height: 110px;
      resize: vertical;
      box-sizing: border-box;
    }
    .card .step-edit {
      margin-left: auto;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.78rem;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }
    .confirm-box {
      background: #f7f9fc;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 0.9rem;
      line-height: 1.8;
      margin-bottom: 16px;
    }
    .confirm-box dt {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 8px;
    }
    .confirm-box dt:first-child { margin-top: 0; }
    .confirm-box dd { margin: 0; font-weight: 600; }
    .secondary-btn {
      width: 100%;
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--navy);
      border-radius: 12px;
      padding: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="page">
    <a href="{{ url_for('index') }}" class="back-link">← トップに戻る</a>
    <div class="logo">KARiN. <span>~Sports & Beauty~</span></div>
    <h1>ご予約</h1>
    <p class="lead">東京・福岡の院内（準備中）/出張をご予約いただけます。<br>帯同および12時間以内のご予約は<a href="https://lin.ee/rVEbNhl5" target="_blank" rel="noopener">公式LINE</a>または<a href="{{ url_for('contact') }}">お問い合わせフォーム</a>をご利用ください。</p>

    <div class="card is-active" id="step-area" data-step="1">
      <h2><span class="step-num">1</span>ご希望のエリア<span class="step-summary" id="summary-1"></span><button type="button" class="step-edit hidden" data-edit="1">変更</button></h2>
      <div class="step-body">
        <div class="chip-row" id="area-chips"></div>
      </div>
    </div>

    <div class="card is-locked" id="step-method" data-step="2">
      <h2><span class="step-num">2</span>施術方法<span class="step-summary" id="summary-2"></span><button type="button" class="step-edit hidden" data-edit="2">変更</button></h2>
      <div class="step-body">
        <div class="chip-row" id="method-chips"></div>
      </div>
    </div>

    <div class="card is-locked" id="step-duration" data-step="3">
      <h2><span class="step-num">3</span>施術時間・希望内容<span class="step-summary" id="summary-3"></span><button type="button" class="step-edit hidden" data-edit="3">変更</button></h2>
      <div class="step-body">
        <p class="course-sub-label">施術時間</p>
        <div class="chip-row" id="duration-chips"></div>
        <label for="web_note" style="display:block;margin-top:16px;font-size:0.85rem;font-weight:600;">希望・伝達事項（任意）</label>
        <textarea id="web_note" name="web_note" placeholder="気になる部位・ご希望など"></textarea>
        <button type="button" class="submit-btn" id="duration-next" style="margin-top:14px;">完了</button>
      </div>
    </div>

    <div class="card is-locked" id="step-datetime" data-step="4">
      <h2><span class="step-num">4</span>日時選択<span class="step-summary" id="summary-4"></span><button type="button" class="step-edit hidden" data-edit="4">変更</button></h2>
      <div class="step-body">
        <p class="course-sub-label">ご希望の日付</p>
        <div class="date-row" id="date-chips"></div>
        <p class="empty-msg hidden" id="date-empty">2週間以内でご予約可能な日がありません。</p>

        <div id="slots-section" class="hidden" style="margin-top:18px;">
          <p class="course-sub-label">時間・担当スタッフ</p>
          <div class="loading hidden" id="slots-loading">空き状況を読み込み中…</div>
          <div class="slots-wrap hidden" id="slots-wrap">
            <table class="slots-table" id="slots-table"></table>
          </div>
          <div class="slot-detail-panel hidden" id="slot-detail-panel">
            <div class="slot-detail-head">
              <span class="slot-detail-title" id="slot-detail-title"></span>
              <button type="button" class="slot-detail-close" id="slot-detail-close" aria-label="閉じる">×</button>
            </div>
            <div class="slot-detail-grid" id="slot-detail-grid"></div>
          </div>
          <p class="legend">○：その1時間すべて空き　△：一部空き　×：予約不可（直近12時間以内を含む）　—：勤務時間外<br>○・△をタップすると15分刻みの詳細が表示されます。</p>
          <button type="button" class="submit-btn" id="datetime-next" style="margin-top:14px;">完了</button>
        </div>
      </div>
    </div>

    <div class="card is-locked" id="step-customer" data-step="5">
      <h2><span class="step-num">5</span>お客様情報<span class="step-summary" id="summary-5"></span><button type="button" class="step-edit hidden" data-edit="5">変更</button></h2>
      <div class="step-body">
        <div class="form-grid">
          <div class="form-row-2">
            <div>
              <label for="last_name">姓 <span style="color:#c0392b">*</span></label>
              <input type="text" id="last_name" name="last_name" required autocomplete="family-name">
            </div>
            <div>
              <label for="first_name">名 <span style="color:#c0392b">*</span></label>
              <input type="text" id="first_name" name="first_name" required autocomplete="given-name">
            </div>
          </div>
          <label for="phone">電話番号 <span style="color:#c0392b">*</span></label>
          <input type="tel" id="phone" name="phone" required autocomplete="tel" placeholder="09012345678">
          <label for="email">メールアドレス <span style="color:#c0392b">*</span></label>
          <input type="email" id="email" name="email" required autocomplete="email">
          <div id="address-wrap" class="hidden">
            <label for="place_name">出張先のエリア・住所 <span style="color:#c0392b">*</span></label>
            <textarea id="place_name" name="place_name" placeholder="例）渋谷区代々木上原"></textarea>
          </div>
          <button type="button" class="submit-btn" id="customer-next">完了</button>
          <p class="error-msg hidden" id="customer-error"></p>
        </div>
      </div>
    </div>

    <div class="card is-locked" id="step-confirm" data-step="6">
      <h2><span class="step-num">6</span>予約確認</h2>
      <div class="step-body">
        <div class="confirm-box" id="confirm-summary"></div>
        <button type="button" class="secondary-btn" id="confirm-back">内容を修正する</button>
        <button type="button" class="submit-btn" id="submit-btn">予約を確定する</button>
        <p class="error-msg hidden" id="form-error"></p>
      </div>
    </div>
  </div>

  <script>
  (function () {
    const FREE_KEY = "__free__";
    const SHOW_FREE_ROW = false;
    const HOUR_START = 10;
    const HOUR_END = 26;
    const state = {
      meta: null,
      area: null,
      areaLabel: "",
      placeType: null,
      placeTypeLabel: "",
      courseType: "total_conditioning",
      duration: null,
      courseLabel: "",
      date: null,
      staffName: null,
      time: null,
      slotsData: null,
      detailStaff: null,
      detailHour: null,
      currentStep: 1,
    };

    const $ = (id) => document.getElementById(id);
    function show(el) { if (el) el.classList.remove("hidden"); }
    function hide(el) { if (el) el.classList.add("hidden"); }

    function isCustomerComplete() {
      const last = ($("last_name") && $("last_name").value.trim()) || "";
      const first = ($("first_name") && $("first_name").value.trim()) || "";
      const phone = ($("phone") && $("phone").value.trim()) || "";
      const email = ($("email") && $("email").value.trim()) || "";
      if (!last || !first || !phone || !email) return false;
      if (state.placeType === "visit") {
        const placeName = ($("place_name") && $("place_name").value.trim()) || "";
        if (!placeName) return false;
      }
      return true;
    }

    function isStepComplete(step) {
      if (step === 1) return !!state.area;
      if (step === 2) return !!state.placeType;
      if (step === 3) return !!state.duration;
      if (step === 4) return !!(state.date && state.time && state.staffName);
      if (step === 5) return isCustomerComplete();
      if (step === 6) return isStepComplete(1) && isStepComplete(2) && isStepComplete(3) && isStepComplete(4) && isStepComplete(5);
      return false;
    }

    function firstIncompleteStep() {
      for (let i = 1; i <= 5; i++) {
        if (!isStepComplete(i)) return i;
      }
      return 6;
    }

    function clearDatetimeOnly() {
      state.date = null;
      state.staffName = null;
      state.time = null;
      state.slotsData = null;
      state.detailStaff = null;
      state.detailHour = null;
      closeSlotDetail();
      hide($("slots-section"));
      if ($("date-chips")) $("date-chips").innerHTML = "";
      updateStepSummaries();
    }

    function updateStepSummaries() {
      const s1 = $("summary-1");
      const s2 = $("summary-2");
      const s3 = $("summary-3");
      const s4 = $("summary-4");
      const s5 = $("summary-5");
      if (s1) s1.textContent = state.areaLabel || "";
      if (s2) s2.textContent = state.placeTypeLabel || "";
      if (s3) s3.textContent = state.duration ? (state.duration + "分") : "";
      if (s4) {
        if (state.date && state.time) {
          const staff = state.staffName === FREE_KEY ? "フリー" : (state.staffName || "");
          s4.textContent = state.date + " " + state.time + (staff ? "（" + staff + "）" : "");
        } else if (state.date) {
          s4.textContent = state.date;
        } else {
          s4.textContent = "";
        }
      }
      if (s5) {
        const ln = ($("last_name") && $("last_name").value.trim()) || "";
        const fn = ($("first_name") && $("first_name").value.trim()) || "";
        s5.textContent = (ln || fn) ? (ln + " " + fn).trim() : "";
      }
    }

    function setStep(n) {
      state.currentStep = n;
      document.querySelectorAll(".card[data-step]").forEach((card) => {
        const step = parseInt(card.dataset.step, 10);
        card.classList.remove("is-locked", "is-active", "is-done");
        const editBtn = card.querySelector(".step-edit");
        if (step === n) {
          card.classList.add("is-active");
          if (editBtn) hide(editBtn);
        } else if (step < n || (step > n && step <= 5 && isStepComplete(step))) {
          card.classList.add("is-done");
          if (editBtn) show(editBtn);
        } else {
          card.classList.add("is-locked");
          if (editBtn) hide(editBtn);
        }
      });
      updateStepSummaries();
      const active = document.querySelector(`.card[data-step="${n}"]`);
      if (active) active.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    async function proceedFromStep(completedStep) {
      updateStepSummaries();
      const next = firstIncompleteStep();
      if (next === 6) {
        $("confirm-summary").innerHTML = buildConfirmHtml();
        setStep(6);
        return;
      }
      setStep(next);
      if (next === 4) {
        await loadDates();
      }
    }

    document.querySelectorAll(".step-edit").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const n = parseInt(btn.dataset.edit, 10);
        setStep(n);
        if (n === 1) {
          document.querySelectorAll("#area-chips .chip").forEach((c) => {
            c.classList.toggle("active", c.dataset.area === state.area);
          });
        }
        if (n === 2) {
          document.querySelectorAll("#method-chips .chip").forEach((c) => {
            c.classList.toggle("active", c.dataset.placeType === state.placeType);
          });
        }
        if (n === 3) {
          document.querySelectorAll("#duration-chips .chip").forEach((c) => {
            c.classList.toggle("active", parseInt(c.dataset.minutes, 10) === state.duration);
          });
        }
        if (n === 4 && state.area && state.duration) {
          if (!$("date-chips").children.length) {
            await loadDates();
          } else if (state.date) {
            document.querySelectorAll("#date-chips .date-chip").forEach((c) => {
              c.classList.toggle("active", c.dataset.date === state.date);
            });
          }
          if (state.date) {
            show($("slots-section"));
            if (!state.slotsData) {
              await loadSlots();
            } else {
              renderSlotsTable(state.slotsData);
              show($("slots-wrap"));
            }
          }
        }
      });
    });

    async function loadMeta() {
      const res = await fetch("/api/book/meta");
      state.meta = await res.json();
      renderAreas();
      renderMethods();
      renderDurations();
      setStep(1);
    }

    function renderAreas() {
      const row = $("area-chips");
      row.innerHTML = "";
      (state.meta.areas || []).forEach((a) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip" + (a.selectable === false ? " disabled" : "");
        btn.innerHTML = a.label + (a.badge ? `<span class="chip-badge">${a.badge}</span>` : "");
        btn.dataset.area = a.id;
        if (a.selectable === false) {
          btn.disabled = true;
        } else {
          btn.addEventListener("click", () => selectArea(a.id, a.label, btn));
        }
        row.appendChild(btn);
      });
    }

    function selectArea(areaId, label, btn) {
      const changed = state.area !== areaId;
      state.area = areaId;
      state.areaLabel = label;
      document.querySelectorAll("#area-chips .chip").forEach((c) => c.classList.remove("active"));
      btn.classList.add("active");
      if (changed) clearDatetimeOnly();
      proceedFromStep(1);
    }

    function renderMethods() {
      const row = $("method-chips");
      row.innerHTML = "";
      (state.meta.place_types || [
        { id: "visit", label: "出張", selectable: true },
        { id: "in_house", label: "院内（準備中）", selectable: false },
      ]).forEach((m) => {
        const btn = document.createElement("button");
        btn.type = "button";
        const selectable = m.selectable !== false;
        btn.className = "chip" + (selectable ? "" : " disabled");
        btn.textContent = m.label;
        btn.dataset.placeType = m.id;
        if (!selectable) {
          btn.disabled = true;
        } else {
          btn.addEventListener("click", () => selectMethod(m.id, m.label, btn));
        }
        row.appendChild(btn);
      });
    }

    function selectMethod(id, label, btn) {
      const changed = state.placeType !== id;
      state.placeType = id;
      state.placeTypeLabel = label;
      document.querySelectorAll("#method-chips .chip").forEach((c) => c.classList.remove("active"));
      btn.classList.add("active");
      if (id === "visit") show($("address-wrap"));
      else hide($("address-wrap"));
      if (changed) clearDatetimeOnly();
      proceedFromStep(2);
    }

    function renderDurations() {
      const row = $("duration-chips");
      row.innerHTML = "";
      (state.meta.durations || [120, 90, 60]).forEach((m) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.textContent = m + "分";
        btn.dataset.minutes = m;
        btn.addEventListener("click", () => {
          const changed = state.duration !== m;
          state.duration = m;
          state.courseType = "total_conditioning";
          state.courseLabel = "トータルコンディショニング " + m + "分";
          document.querySelectorAll("#duration-chips .chip").forEach((c) => c.classList.remove("active"));
          btn.classList.add("active");
          if (changed) clearDatetimeOnly();
          updateStepSummaries();
        });
        row.appendChild(btn);
      });
    }

    $("duration-next").addEventListener("click", async () => {
      if (!state.duration) {
        alert("施術時間を選択してください");
        return;
      }
      await proceedFromStep(3);
    });

    async function loadDates() {
      const row = $("date-chips");
      row.innerHTML = "";
      hide($("date-empty"));
      const qs = new URLSearchParams({
        area: state.area,
        duration: String(state.duration),
        course_type: state.courseType || "total_conditioning",
        place_type: state.placeType || "in_house",
      });
      const res = await fetch("/api/book/dates?" + qs.toString());
      const data = await res.json();
      let any = false;
      (data.dates || []).forEach((d) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "date-chip";
        btn.dataset.date = d.date;
        btn.disabled = !d.selectable;
        btn.innerHTML = '<div class="d">' + d.label + '</div><div class="w">' + d.weekday + "</div>";
        if (d.selectable) {
          any = true;
          if (state.date === d.date) btn.classList.add("active");
          btn.addEventListener("click", () => selectDate(d.date, btn));
        }
        row.appendChild(btn);
      });
      if (!any) {
        show($("date-empty"));
      }
    }

    async function selectDate(dateStr, btn) {
      state.date = dateStr;
      document.querySelectorAll("#date-chips .date-chip").forEach((c) => c.classList.remove("active"));
      btn.classList.add("active");
      state.staffName = null;
      state.time = null;
      show($("slots-section"));
      await loadSlots();
    }

    async function loadSlots() {
      closeSlotDetail();
      show($("slots-loading"));
      hide($("slots-wrap"));
      const qs = new URLSearchParams({
        area: state.area,
        date: state.date,
        duration: String(state.duration),
        course_type: state.courseType || "total_conditioning",
        place_type: state.placeType || "in_house",
      });
      const res = await fetch("/api/book/slots?" + qs.toString());
      const data = await res.json();
      state.slotsData = data;
      hide($("slots-loading"));
      renderSlotsTable(data);
      show($("slots-wrap"));
    }

    function timesInHour(hour) {
      return [0, 15, 30, 45].map((m) =>
        String(hour).padStart(2, "0") + ":" + String(m).padStart(2, "0")
      );
    }

    function classifyHour(slotMap, hour) {
      const times = timesInHour(hour);
      let definedCount = 0;
      let availCount = 0;
      let ngCount = 0;
      for (const t of times) {
        const s = slotMap[t];
        if (!s) continue;
        definedCount++;
        if (s.available) availCount++;
        else ngCount++;
      }
      if (definedCount === 0) return "none";
      const missingCount = times.length - definedCount;
      if (availCount === 0) return "ng";
      if (missingCount > 0 || ngCount > 0) return "partial";
      return "full";
    }

    function rowStaffKey(row, freeStaffName) {
      const isFree = row.staff_name === "フリー" || row.staff_name === freeStaffName;
      return isFree ? FREE_KEY : row.staff_name;
    }

    function findRowByStaffKey(data, staffKey) {
      const freeRow = data.free_row || { staff_name: "フリー", slots: [] };
      const staffRows = data.staff || [];
      if (staffKey === FREE_KEY) return freeRow;
      return staffRows.find((r) => r.staff_name === staffKey) || null;
    }

    function closeSlotDetail() {
      state.detailStaff = null;
      state.detailHour = null;
      hide($("slot-detail-panel"));
      document.querySelectorAll(".hour-cell-btn.active-hour").forEach((b) => b.classList.remove("active-hour"));
    }

    function openSlotDetail(staffKey, staffLabel, hour) {
      const data = state.slotsData;
      if (!data) return;
      const row = findRowByStaffKey(data, staffKey);
      if (!row) return;
      state.detailStaff = staffKey;
      state.detailHour = hour;
      document.querySelectorAll(".hour-cell-btn.active-hour").forEach((b) => b.classList.remove("active-hour"));
      document.querySelectorAll('.hour-cell-btn[data-staff="' + staffKey + '"][data-hour="' + hour + '"]').forEach((b) => {
        b.classList.add("active-hour");
      });
      $("slot-detail-title").textContent = staffLabel + " / " + hour + ":00〜" + (hour + 1) + ":00";
      const slotMap = {};
      (row.slots || []).forEach((s) => { slotMap[s.time] = s; });
      const grid = $("slot-detail-grid");
      grid.innerHTML = "";
      timesInHour(hour).forEach((t) => {
        const s = slotMap[t];
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "slot-btn";
        if (!s || !s.available) {
          btn.classList.add("ng");
          btn.disabled = true;
          btn.innerHTML = '<span class="slot-time">' + t + '</span><span class="slot-mark">×</span>';
        } else {
          btn.classList.add("ok");
          if (state.staffName === staffKey && state.time === t) btn.classList.add("selected");
          btn.innerHTML = '<span class="slot-time">' + t + '</span><span class="slot-mark">○</span>';
          btn.addEventListener("click", () => selectSlot(staffKey, t, btn));
        }
        grid.appendChild(btn);
      });
      show($("slot-detail-panel"));
      $("slot-detail-panel").scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function selectSlot(staffKey, time, btn) {
      state.staffName = staffKey;
      state.time = time;
      document.querySelectorAll("#slot-detail-grid .slot-btn.ok").forEach((b) => b.classList.remove("selected"));
      btn.classList.add("selected");
      proceedFromStep(4);
    }

    $("datetime-next").addEventListener("click", () => {
      if (!state.date || !state.time || !state.staffName) {
        alert("日付と時間を選択してください");
        return;
      }
      proceedFromStep(4);
    });

    function renderSlotsTable(data) {
      const table = $("slots-table");
      const staffRows = data.staff || [];
      const freeRow = data.free_row || { staff_name: "フリー", slots: [] };
      const allRows = SHOW_FREE_ROW ? staffRows.concat([freeRow]) : staffRows;
      const hours = [];
      for (let h = HOUR_START; h <= HOUR_END; h++) hours.push(h);
      let html = "<thead><tr><th class='staff-col'>担当</th>";
      hours.forEach((h) => { html += "<th>" + h + ":00</th>"; });
      html += "</tr></thead><tbody>";
      allRows.forEach((row) => {
        const staffKey = rowStaffKey(row, freeRow.staff_name);
        html += '<tr><td class="staff-col">' + row.staff_name + "</td>";
        const slotMap = {};
        (row.slots || []).forEach((s) => { slotMap[s.time] = s; });
        hours.forEach((h) => {
          const status = classifyHour(slotMap, h);
          const active = state.detailStaff === staffKey && state.detailHour === h ? " active-hour" : "";
          if (status === "full") {
            html += '<td><button type="button" class="hour-cell-btn full' + active + '" data-staff="' + staffKey + '" data-hour="' + h + '">○</button></td>';
          } else if (status === "partial") {
            html += '<td><button type="button" class="hour-cell-btn partial' + active + '" data-staff="' + staffKey + '" data-hour="' + h + '">△</button></td>';
          } else if (status === "ng") {
            html += '<td><button type="button" class="hour-cell-btn ng" disabled>×</button></td>';
          } else {
            html += '<td><button type="button" class="hour-cell-btn none" disabled>—</button></td>';
          }
        });
        html += "</tr>";
      });
      html += "</tbody>";
      table.innerHTML = html;
      table.querySelectorAll(".hour-cell-btn.full, .hour-cell-btn.partial").forEach((btn) => {
        btn.addEventListener("click", () => {
          const staffKey = btn.dataset.staff;
          const hour = parseInt(btn.dataset.hour, 10);
          const row = findRowByStaffKey(data, staffKey);
          const staffLabel = row ? row.staff_name : staffKey;
          openSlotDetail(staffKey, staffLabel, hour);
        });
      });
    }

    $("slot-detail-close").addEventListener("click", closeSlotDetail);

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function buildConfirmHtml() {
      const staffLabel = state.staffName === FREE_KEY ? "フリー（自動割当）" : state.staffName;
      const note = ($("web_note").value || "").trim() || "なし";
      const placeName = ($("place_name").value || "").trim();
      let html = "<dl>";
      html += "<dt>エリア</dt><dd>" + escapeHtml(state.areaLabel) + "</dd>";
      html += "<dt>施術方法</dt><dd>" + escapeHtml(state.placeTypeLabel) + "</dd>";
      html += "<dt>施術時間</dt><dd>" + escapeHtml(state.courseLabel) + "</dd>";
      html += "<dt>希望日時</dt><dd>" + escapeHtml(state.date + " " + state.time) + "（担当：" + escapeHtml(staffLabel) + "）</dd>";
      html += "<dt>希望・伝達事項</dt><dd>" + escapeHtml(note) + "</dd>";
      html += "<dt>お名前</dt><dd>" + escapeHtml($("last_name").value.trim() + " " + $("first_name").value.trim()) + "</dd>";
      html += "<dt>電話番号</dt><dd>" + escapeHtml($("phone").value.trim()) + "</dd>";
      html += "<dt>メール</dt><dd>" + escapeHtml($("email").value.trim()) + "</dd>";
      if (state.placeType === "visit") {
        html += "<dt>出張先</dt><dd>" + escapeHtml(placeName) + "</dd>";
      }
      html += "</dl>";
      return html;
    }

    $("customer-next").addEventListener("click", () => {
      const err = $("customer-error");
      hide(err);
      const last = $("last_name").value.trim();
      const first = $("first_name").value.trim();
      const phone = $("phone").value.trim();
      const email = $("email").value.trim();
      const placeName = $("place_name").value.trim();
      if (!last || !first || !phone || !email) {
        err.textContent = "必須項目を入力してください";
        show(err);
        return;
      }
      if (state.placeType === "visit" && !placeName) {
        err.textContent = "出張先のエリア・住所を入力してください";
        show(err);
        return;
      }
      if (!state.date || !state.time || !state.staffName) {
        err.textContent = "日時を選択してください";
        show(err);
        return;
      }
      proceedFromStep(5);
    });

    $("confirm-back").addEventListener("click", () => setStep(5));

    $("submit-btn").addEventListener("click", async () => {
      const errEl = $("form-error");
      hide(errEl);
      const btn = $("submit-btn");
      btn.disabled = true;
      btn.textContent = "送信中…";
      try {
        const payload = {
          area: state.area,
          place_type: state.placeType,
          place_name: $("place_name").value.trim(),
          date: state.date,
          time: state.time,
          duration_minutes: state.duration,
          course_type: state.courseType,
          staff_name: state.staffName,
          course_request: state.courseLabel,
          last_name: $("last_name").value.trim(),
          first_name: $("first_name").value.trim(),
          phone: $("phone").value.trim(),
          email: $("email").value.trim(),
          web_note: $("web_note").value.trim(),
        };
        const res = await fetch("/api/book", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          throw new Error(data.message || "予約に失敗しました");
        }
        window.location.href = data.redirect || "/book/complete";
      } catch (err) {
        errEl.textContent = err.message || "予約に失敗しました";
        show(errEl);
        btn.disabled = false;
        btn.textContent = "予約を確定する";
      }
    });

    loadMeta().catch(() => {
      $("area-chips").innerHTML = "<p class='error-msg'>読み込みに失敗しました。ページを再読み込みしてください。</p>";
    });
  })();
  </script>
</body>
</html>
