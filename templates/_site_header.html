<header class="header">
  <a href="{{ url_for('index') }}" class="logo">KARiN.</a>
  <button type="button" class="hamburger" id="hamburger" aria-label="メニューを開く" aria-expanded="false" aria-controls="nav-menu">
    <span></span><span></span><span></span>
  </button>
  <div class="nav-overlay" id="nav-overlay" hidden></div>
  <nav class="nav site-nav" id="nav-menu" aria-label="メインメニュー">
    {% if request.endpoint != 'index' %}
    <a href="{{ url_for('index') }}">トップ</a>
    {% endif %}
    {% if request.endpoint != 'first' %}
    <a href="{{ url_for('first') }}">初めての方へ</a>
    {% endif %}
    {% if request.endpoint != 'treatment' %}
    <a href="{{ url_for('treatment') }}">施術内容</a>
    {% endif %}
    {% if request.endpoint != 'price' %}
    <a href="{{ url_for('price') }}">料金表</a>
    {% endif %}
    <a href="{{ url_for('blog') }}"{% if request.endpoint == 'blog' %} class="nav-current" aria-current="page"{% endif %}>KARiN.NOTES</a>
    <a href="{{ url_for('index') }}#profile">プロフィール</a>
    <div class="nav-cta">
      <a href="{{ url_for('contact') }}" class="nav-consult{% if request.endpoint == 'contact' %} nav-current{% endif %}"{% if request.endpoint == 'contact' %} aria-current="page"{% endif %}>相談する</a>
      <a href="{{ url_for('book_page') }}" class="nav-book{% if request.endpoint == 'book_page' %} nav-current{% endif %}"{% if request.endpoint == 'book_page' %} aria-current="page"{% endif %}>予約する</a>
    </div>
  </nav>
</header>
